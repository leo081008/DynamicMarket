name: Build DynamicMarket JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Extract pom.xml, plugin.yml and config.yml
        run: |
          python3 -c '
          import pathlib, re
          code = pathlib.Path("src/main/java/de/dynamicmarket/DynamicMarket.java").read_text(encoding="utf-8")
          def extract(const_name):
              pattern = r"EMBEDDED_" + const_name + r"\s*=\s*\"\"\"\s*\n(.*?)\"\"\";"
              m = re.search(pattern, code, re.DOTALL)
              return m.group(1)
          pathlib.Path("src/main/resources").mkdir(parents=True, exist_ok=True)
          pathlib.Path("pom.xml").write_text(extract("POM_XML"), encoding="utf-8")
          pathlib.Path("src/main/resources/plugin.yml").write_text(extract("PLUGIN_YML"), encoding="utf-8")
          pathlib.Path("src/main/resources/config.yml").write_text(extract("CONFIG_YML"), encoding="utf-8")
          '

      - name: Build Plugin JAR with Maven
        run: mvn clean package

      - name: Upload Finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: DynamicMarket-Plugin-JAR
          path: target/DynamicMarket-26.3.0.jar
